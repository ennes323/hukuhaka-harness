name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tag matches /VERSION
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PROJECT_VERSION=$(head -n1 VERSION | tr -d '[:space:]')
          if [ "$TAG" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG does not match /VERSION ($PROJECT_VERSION)"
            exit 1
          fi
          echo "Version verified: $PROJECT_VERSION"

      - name: Run validation
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          profile=public
          if [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
            profile=private
          fi
          scripts/validate.sh --profile "$profile"

      - name: Create private GitHub Release
        if: github.event.repository.private
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  live-install:
    name: Live install (${{ matrix.os }})
    needs: release
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the documented explicit Codex installer
        shell: bash
        run: scripts/tests/live-install-codex.sh "${GITHUB_REF_NAME#v}"

  publish-release:
    name: Publish GitHub Release
    needs: [release, live-install]
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
