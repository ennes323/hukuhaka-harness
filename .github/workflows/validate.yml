name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run validation
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          profile=public
          if [ "$REPOSITORY_IS_PRIVATE" = "true" ]; then
            profile=private
          fi
          scripts/validate.sh --profile "$profile"

      - name: Check version bump on plugin changes
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: scripts/tests/check-plugin-version-bumps.sh "${{ github.event.pull_request.base.sha }}"
